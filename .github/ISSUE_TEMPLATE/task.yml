name: "Task"
description: "리팩토링, 인프라, 개선 작업"
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        ## 작업 요청
        리팩토링, 성능 개선, DX 개선, 기술 부채 해소 등에 사용합니다.

  - type: textarea
    id: description
    attributes:
      label: "작업 내용"
      description: "무엇을, 왜 변경하는지 설명해주세요."
      placeholder: "상품 목록 컴포넌트의 렌더링 최적화를 위해 React.memo와 가상 스크롤을 적용합니다."
    validations:
      required: true

  - type: textarea
    id: current-state
    attributes:
      label: "현재 상태"
      description: "현재 코드/구조의 문제점이나 상황을 설명해주세요."
      placeholder: |
        - ProductCard가 부모 리렌더링마다 전체 재렌더링됨
        - 100개 이상의 상품 로드 시 스크롤 버벅임
        - Lighthouse Performance 점수 65점
    validations:
      required: true

  - type: textarea
    id: target-state
    attributes:
      label: "목표 상태"
      description: "변경 후 달성하려는 상태를 구체적으로 작성해주세요."
      placeholder: |
        - ProductCard에 React.memo 적용, props 비교 최적화
        - 가상 스크롤로 DOM 노드 수 제한
        - Lighthouse Performance 점수 85점 이상
    validations:
      required: true

  - type: textarea
    id: affected-scope
    attributes:
      label: "영향 범위"
      description: "변경에 의해 영향받는 컴포넌트, 페이지, 모듈을 나열해주세요."
      placeholder: |
        - components/domain/ProductCard.tsx
        - app/(main)/products/page.tsx
        - features/product/hooks.ts
    validations:
      required: true

  - type: textarea
    id: done-criteria
    attributes:
      label: "완료 조건"
      description: "이 작업이 완료되었다고 판단할 수 있는 조건"
      placeholder: |
        - [ ] React.memo 적용 및 불필요한 리렌더링 제거
        - [ ] 기존 기능 정상 동작 확인
        - [ ] Lighthouse 성능 점수 개선 확인
    validations:
      required: true

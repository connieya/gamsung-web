name: "Bug Report"
description: "버그 리포트"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## 버그 리포트
        재현 가능한 버그를 보고할 때 사용합니다.

  - type: textarea
    id: summary
    attributes:
      label: "버그 요약"
      description: "어떤 문제가 발생하는지 한 줄로 요약해주세요."
      placeholder: "장바구니 페이지에서 수량 변경 시 총 금액이 갱신되지 않음"
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: "재현 단계"
      description: "버그를 재현할 수 있는 단계를 순서대로 작성해주세요."
      placeholder: |
        1. 장바구니에 상품 2개를 담는다
        2. 첫 번째 상품의 수량을 3으로 변경한다
        3. 하단 총 결제 금액을 확인한다
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "기대 결과"
      description: "정상적으로 동작했을 때 예상되는 결과"
      placeholder: "수량 변경이 즉시 반영되어 총 금액이 갱신되어야 함"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "실제 결과"
      description: "현재 실제로 발생하는 결과"
      placeholder: "수량은 변경되지만 총 금액이 이전 값으로 유지됨"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "콘솔 로그 / 에러 메시지"
      description: "브라우저 콘솔 에러, 네트워크 오류 등이 있다면 첨부해주세요."
      render: shell
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: "심각도"
      options:
        - "Critical — 화면 렌더링 불가, 결제 오류"
        - "Major — 핵심 기능 오동작 (장바구니, 주문 등)"
        - "Minor — 부가 기능 오동작, 우회 가능"
        - "Low — UI 깨짐, 오타, 스타일 이슈"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "환경 정보"
      description: "버그가 발생한 환경"
      placeholder: |
        - 브라우저: Chrome 120 / Safari 17
        - 디바이스: iPhone 15 / Desktop
        - OS: iOS 17 / macOS Sonoma
        - 화면 크기: 375px / 1440px
    validations:
      required: false

  - type: textarea
    id: screenshot
    attributes:
      label: "스크린샷 / 영상"
      description: "버그 상황을 보여주는 스크린샷이나 영상이 있다면 첨부해주세요."
    validations:
      required: false
